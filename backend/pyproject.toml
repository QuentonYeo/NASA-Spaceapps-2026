[project]
name = "spherex-blink-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "botocore>=1.43.117",
    "fastapi>=0.162.7",
    "firefly-client>=3.4.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyvo>=1.10.0",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "s3fs>=2024.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
